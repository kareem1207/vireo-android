org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=false
# Kotlin incremental compilation has repeatedly gone stale on this project
# (spurious "Unresolved reference" after signature changes). Full recompile of
# this small module is only a few seconds; not worth the flakiness.
kotlin.incremental=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
